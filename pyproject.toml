[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan"
version = "0.1.1"
description = "The reliability scale for AI agents: restore, balance, classify, constrain, verify, weigh."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mousa Abumazin" }]
keywords = ["ai", "agents", "reliability", "arabic", "tool-calling", "preflight"]

# The preflight primitives (jabr, muqabalah, qadiya) are not yet on PyPI.
# Until they are published, install them editable alongside mizan:
#   pip install -e ../jabr -e ../muqabalah -e ../qadiya -e .
# mizan also adds local source checkouts under ~/Projects to sys.path as a
# fallback, so it imports in a dev tree without an install step.
dependencies = []

[project.urls]
Source = "https://github.com/Moshe-ship/mizan"
Issues = "https://github.com/Moshe-ship/mizan/issues"
Documentation = "https://github.com/Moshe-ship/mizan/blob/main/docs/MCP_POISONING_BENCHMARK.md"

# PyPI forbids direct-URL (git+https) dependencies, so the primitives
# (jabr/muqabalah/qadiya/mtg/toolproof) are NOT declared as extras here — they
# are not yet on PyPI. Install them manually from git, or editable from a dev
# tree (see README). mizan also adds local checkouts under ~/Projects to
# sys.path as a fallback, so it imports without an install step.
# Only PyPI-installable extras are declared below.
[project.optional-dependencies]
test = ["pytest>=7"]
mcpscan = []  # no deps — detectors are vendored; bare `pip install mizan` runs the scanner
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]

[tool.setuptools]
packages = ["mizan"]
