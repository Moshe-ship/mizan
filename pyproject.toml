[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan"
version = "0.1.7"
description = "The reliability scale for AI agents: restore, balance, classify, constrain, verify, weigh."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mousa Abumazin" }]
keywords = ["ai", "agents", "reliability", "arabic", "tool-calling", "preflight"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

# Core install is dependency-free: `pip install mizan` runs the mcpscan
# scanner standalone. The reliability pipeline (preflight/verify) pulls the
# primitives from PyPI via the extras below.
dependencies = []

[project.urls]
Source = "https://github.com/Moshe-ship/mizan"
Issues = "https://github.com/Moshe-ship/mizan/issues"
Documentation = "https://github.com/Moshe-ship/mizan/blob/main/docs/MCP_POISONING_BENCHMARK.md"

# The primitives are now on PyPI, so the pipeline is plain-pip installable.
# Conservative caps: pin to the current minor, allow patch upgrades.
# Note import vs install names: mtg-guards -> import mtg; toolproof-receipt -> import toolproof.
[project.optional-dependencies]
test = ["pytest>=7"]
mcpscan = []  # no deps — detectors are vendored; bare `pip install mizan` runs the scanner
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
preflight = [
    "jabr>=0.1.0,<0.2.0",
    "muqabalah>=0.1.0,<0.2.0",
    "qadiya>=0.1.0,<0.2.0",
]
verify = ["toolproof-receipt>=0.5.2,<0.6.0"]
openai = ["openai-agents>=0.1"]  # OpenAI Agents SDK — only for the adapter; core needs none
all = [
    "jabr>=0.1.0,<0.2.0",
    "muqabalah>=0.1.0,<0.2.0",
    "qadiya>=0.1.0,<0.2.0",
    "mtg-guards>=0.1.0,<0.2.0",
    "toolproof-receipt>=0.5.2,<0.6.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[project.scripts]
mizan = "mizan.__main__:main"

[tool.setuptools]
packages = ["mizan", "mizan.adapters"]

[tool.setuptools.package-data]
mizan = ["schemas/*.json"]
