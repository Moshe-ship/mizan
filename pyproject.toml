[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan"
version = "0.1.0"
description = "The reliability scale for AI agents: restore, balance, classify, constrain, verify, weigh."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mousa Abumazin" }]
keywords = ["ai", "agents", "reliability", "arabic", "tool-calling", "preflight"]

# The preflight primitives (jabr, muqabalah, qadiya) are not yet on PyPI.
# Until they are published, install them editable alongside mizan:
#   pip install -e ../jabr -e ../muqabalah -e ../qadiya -e .
# mizan also adds local source checkouts under ~/Projects to sys.path as a
# fallback, so it imports in a dev tree without an install step.
dependencies = []

# The primitives are not yet on PyPI, so they are optional extras installed
# from git. In a dev tree mizan also adds local checkouts under ~/Projects to
# sys.path as a fallback, so it imports without an install step.
[project.optional-dependencies]
test = ["pytest>=7"]
preflight = [
    "jabr @ git+https://github.com/Moshe-ship/jabr.git",
    "muqabalah @ git+https://github.com/Moshe-ship/muqabalah.git",
    "qadiya @ git+https://github.com/Moshe-ship/qadiya.git",
]
mcpscan = ["mtg @ git+https://github.com/Moshe-ship/mtg.git"]
verify = ["toolproof @ git+https://github.com/Moshe-ship/toolproof.git"]
all = [
    "jabr @ git+https://github.com/Moshe-ship/jabr.git",
    "muqabalah @ git+https://github.com/Moshe-ship/muqabalah.git",
    "qadiya @ git+https://github.com/Moshe-ship/qadiya.git",
    "mtg @ git+https://github.com/Moshe-ship/mtg.git",
    "toolproof @ git+https://github.com/Moshe-ship/toolproof.git",
]

[tool.setuptools]
packages = ["mizan"]
