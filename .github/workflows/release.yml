name: Publish to PyPI

# Publishes mizan to PyPI on every version tag (e.g. v0.1.2) via PyPI
# Trusted Publishing (OIDC) — no API token or secret is stored anywhere.
# Trusted publisher registered at:
#   https://pypi.org/manage/project/mizan/settings/publishing/
#   Owner: Moshe-ship · Repository: mizan · Workflow: release.yml · Environment: pypi
#
# Action versions are pinned to commit SHAs (supply-chain hardening): mizan is
# a security tool, so it must not trust mutable tags. Bump via Dependabot.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mizan/
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          # Lets a re-run after a transient mid-upload network drop complete the
          # release instead of 400ing on already-uploaded files. The
          # verify-published job below is the gate that a partial release fails.
          skip-existing: true

  verify-published:
    name: Verify published release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Require version, wheel+sdist, provenance, and an install smoke
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          echo "Verifying mizan $VERSION on PyPI"
          # Poll until BOTH the wheel AND the sdist are indexed — they can
          # propagate to the JSON seconds apart, so waiting only for the version
          # to appear (any one file) is a flaky false-negative.
          for i in $(seq 1 20); do
            if curl -sf "https://pypi.org/pypi/mizan/$VERSION/json" -o /tmp/pj.json \
               && python -c "import json,sys; f=[u['filename'] for u in json.load(open('/tmp/pj.json'))['urls']]; sys.exit(0 if any(x.endswith('.whl') for x in f) and any(x.endswith('.tar.gz') for x in f) else 1)"; then
              break
            fi
            echo "  waiting for both wheel + sdist on the index…"; sleep 15
          done
          python - <<'PY'
          import json, os
          v = os.environ["VERSION"]
          files = [u["filename"] for u in json.load(open("/tmp/pj.json"))["urls"]]
          assert any(f.endswith(".whl") for f in files), f"no wheel for {v}: {files}"
          assert any(f.endswith(".tar.gz") for f in files), f"no sdist for {v}: {files}"
          print("files OK:", files)
          PY
          for f in $(python -c "import json;print(' '.join(u['filename'] for u in json.load(open('/tmp/pj.json'))['urls']))"); do
            # provenance can also lag — retry per file
            code=000
            for j in $(seq 1 8); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/integrity/mizan/$VERSION/$f/provenance")
              [ "$code" = "200" ] && break || sleep 10
            done
            echo "provenance $f: HTTP $code"
            [ "$code" = "200" ] || { echo "::error::missing provenance for $f"; exit 1; }
          done
          for i in $(seq 1 6); do python -m pip install -q "mizan==$VERSION" && break || sleep 15; done
          python -c "import mizan, importlib.metadata as m; assert m.version('mizan')==__import__('os').environ['VERSION']; print('install smoke OK', mizan.__version__)"
