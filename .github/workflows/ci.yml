name: CI

# Runs the test suite on every push and PR across supported Python versions.
# Action versions are pinned to commit SHAs (supply-chain hardening).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with test + otel extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,otel]"
      - name: Run tests
        run: python -m pytest -q
