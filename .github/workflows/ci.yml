name: CI

# Runs the test suite on every push and PR across supported Python versions.
# Action versions are pinned to commit SHAs (supply-chain hardening).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install primitives from git
        # The preflight/verify pipeline depends on jabr/muqabalah/qadiya/mtg/
        # toolproof, which are not yet on PyPI. CI installs them from git so the
        # full suite runs exactly as the README's "install from git" path —
        # without them, mizan.preflight cannot import (it needs jabr).
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "git+https://github.com/Moshe-ship/jabr.git" \
            "git+https://github.com/Moshe-ship/muqabalah.git" \
            "git+https://github.com/Moshe-ship/qadiya.git" \
            "git+https://github.com/Moshe-ship/mtg.git" \
            "git+https://github.com/Moshe-ship/toolproof.git"
      - name: Install mizan (with test + otel extras)
        run: python -m pip install -e ".[test,otel]"
      - name: Run tests
        run: python -m pytest -q
