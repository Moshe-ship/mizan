name: CI

# Runs the test suite on every push and PR across supported Python versions.
# Action versions are pinned to commit SHAs (supply-chain hardening).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install primitives from git
        # The preflight/verify pipeline depends on jabr/muqabalah/qadiya/mtg/
        # toolproof, which are not yet on PyPI. CI installs them from git so the
        # full suite runs exactly as the README's "install from git" path —
        # without them, mizan.preflight cannot import (it needs jabr).
        run: |
          python -m pip install --upgrade pip
          # Pinned to commit SHAs for reproducible CI (bump deliberately).
          python -m pip install \
            "git+https://github.com/Moshe-ship/jabr.git@41dcd3a6126aa53ee08b4940b190fcd14bcb7ca7" \
            "git+https://github.com/Moshe-ship/muqabalah.git@0a08e1478fc4a48c7b95df02390f2a7890b603a7" \
            "git+https://github.com/Moshe-ship/qadiya.git@60af2656975f4356d9d28ea1b630941e17ce6d65" \
            "git+https://github.com/Moshe-ship/mtg.git@91ce06df6ce10d94a051809014cedc36a5b525b8" \
            "git+https://github.com/Moshe-ship/toolproof.git@6a4bb9f26fa91379f71848f05587d963dbc78e8b"
      - name: Install mizan (with test + otel extras)
        run: python -m pip install -e ".[test,otel]"
      - name: Run tests
        run: python -m pytest -q

  scanner-standalone:
    # Proves the README promise: `pip install mizan` gives a working scanner
    # with NO primitives installed. Guards the regression where __init__
    # eagerly imported preflight -> jabr and broke every import for pip users.
    name: Scanner works without primitives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install ONLY mizan (no primitives, no extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Scanner imports and runs; preflight fails friendly
        run: |
          python - <<'PY'
          import mizan
          from mizan.mcpscan import scan_tool, decide, report, ScanConfig
          res = scan_tool({"name": "t", "description": "hi ‮ reversed"})
          assert "BIDI" in report(res), "scanner should flag the BiDi threat"
          print("scanner OK, mizan", mizan.__version__)

          # preflight must raise a friendly MissingPrimitiveError, not a bare ImportError
          from mizan._primitives import MissingPrimitiveError
          try:
              from mizan import preflight  # triggers lazy jabr import
              raise SystemExit("expected MissingPrimitiveError, preflight imported")
          except MissingPrimitiveError as e:
              assert "git+https://github.com/Moshe-ship/jabr.git" in str(e)
              print("friendly error OK:", str(e).splitlines()[0])
          PY
