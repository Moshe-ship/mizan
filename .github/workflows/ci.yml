name: CI

# Runs the test suite on every push and PR across supported Python versions.
# Action versions are pinned to commit SHAs (supply-chain hardening).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install mizan + full pipeline from PyPI
        # The primitives are on PyPI now, so the full suite installs the
        # published packages via the [all] extra — exactly what a user gets.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test,ed25519,openai,langgraph]"
      - name: Run tests
        run: python -m pytest -q

  crewai-adapter:
    # CrewAI's native deps (tiktoken, …) build on 3.11/3.12, so the real CrewAI
    # adapter smoke test runs in a dedicated 3.11 job rather than the matrix.
    name: CrewAI adapter (real runtime, py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install mizan + crewai extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,crewai]"
      - name: Run the real CrewAI adapter smoke test
        run: python -m pytest tests/test_adapter_crewai.py -v

  scanner-standalone:
    # Proves the README promise: `pip install mizan` gives a working scanner
    # with NO primitives installed. Guards the regression where __init__
    # eagerly imported preflight -> jabr and broke every import for pip users.
    name: Scanner works without primitives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install ONLY mizan (no primitives, no extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Scanner imports and runs; preflight fails friendly
        run: |
          python - <<'PY'
          import mizan
          from mizan.mcpscan import scan_tool, decide, report, ScanConfig
          res = scan_tool({"name": "t", "description": "hi ‮ reversed"})
          assert "BIDI" in report(res), "scanner should flag the BiDi threat"
          print("scanner OK, mizan", mizan.__version__)

          # preflight must raise a friendly MissingPrimitiveError, not a bare ImportError
          from mizan._primitives import MissingPrimitiveError
          try:
              from mizan import preflight  # triggers lazy jabr import
              raise SystemExit("expected MissingPrimitiveError, preflight imported")
          except MissingPrimitiveError as e:
              assert "mizan[preflight]" in str(e), str(e)
              print("friendly error OK:", str(e).splitlines()[0])
          PY

  pypi-smoke:
    # Installs the PUBLISHED mizan[all] from PyPI (not the source tree) and runs
    # the pipeline end to end — verifies the live package, exactly as a user
    # gets it. Tests the latest release on PyPI, so it lags a tag by one publish.
    name: Published mizan[all] from PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install published mizan[all] from PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mizan[all]"
      - name: Run the pipeline against the PyPI-installed stack
        run: |
          python - <<'PY'
          import mizan
          from mizan import preflight, PreflightContext
          r = preflight("send it. cancel it.",
                        PreflightContext(contradiction_predicates=[("send", "cancel")]))
          assert r.ok is False and r.contradiction is not None, "preflight should fail loud"
          from mizan.mcpscan import scan_tool, report
          assert "BIDI" in report(scan_tool({"name": "t", "description": "x ‮ rev"}))
          print("PyPI mizan[all] OK:", mizan.__version__)
          PY
